<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Currency Cart with PayPal</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #ccc;
    }
    .cart-item input { width: 50px; }
    .total { font-size: 20px; font-weight: bold; margin-top: 20px; }
    #paypal-button-container { margin-top: 20px; }
    select { margin-top: 10px; padding: 5px; }
  </style>
</head>
<body>

<h2>Shopping Cart</h2>

<div id="cart">
  <div class="cart-item" data-price="1200">
    <span>Item 1</span>
    <input type="number" value="1" min="1" class="quantity">
    <span class="price">₹1200</span>
  </div>
  <div class="cart-item" data-price="800">
    <span>Item 2</span>
    <input type="number" value="2" min="1" class="quantity">
    <span class="price">₹800</span>
  </div>
  <div class="cart-item" data-price="1500">
    <span>Item 3</span>
    <input type="number" value="1" min="1" class="quantity">
    <span class="price">₹1500</span>
  </div>
</div>

<div class="total">Total: ₹<span id="total">0</span></div>

<label for="currency">Select Currency:</label>
<select id="currency">
  <option value="INR">INR - Indian Rupee</option>
  <option value="USD">USD - US Dollar</option>
  <option value="EUR">EUR - Euro</option>
  <option value="GBP">GBP - British Pound</option>
  <option value="CAD">CAD - Canadian Dollar</option>
  <option value="AUD">AUD - Australian Dollar</option>
  <option value="JPY">JPY - Japanese Yen</option>
  <option value="CHF">CHF - Swiss Franc</option>
  <option value="SGD">SGD - Singapore Dollar</option>
  <option value="NZD">NZD - New Zealand Dollar</option>
</select>

<div id="paypal-button-container"></div>

<script>
  let totalDisplay = document.getElementById('total');
  let currencySelect = document.getElementById('currency');

  function calculateTotal() {
    let total = 0;
    document.querySelectorAll('.cart-item').forEach(item => {
      const price = parseFloat(item.dataset.price);
      const quantity = parseInt(item.querySelector('.quantity').value);
      total += price * quantity;
    });
    totalDisplay.textContent = total.toFixed(2);
    return total;
  }

  document.querySelectorAll('.quantity').forEach(input => {
    input.addEventListener('input', () => {
      calculateTotal();
    });
  });

  let currentTotal = calculateTotal();

  function loadPayPalScript(currency) {
    const existingScript = document.querySelector('#paypal-script');
    if (existingScript) existingScript.remove();

    const script = document.createElement('script');
    script.src = `https://www.paypal.com/sdk/js?client-id=YOUR_CLIENT_ID_HERE&currency=${currency}`;
    script.id = 'paypal-script';
    script.onload = () => renderPayPalButton(currency);
    document.body.appendChild(script);
  }

  function renderPayPalButton(currency) {
    if (paypal?.Buttons) {
      document.getElementById('paypal-button-container').innerHTML = '';
      paypal.Buttons({
        style: {
          layout: 'vertical',
          color:  'blue',
          shape:  'rect',
          label:  'paypal'
        },
        createOrder: function(data, actions) {
          const total = calculateTotal();
          return actions.order.create({
            purchase_units: [{
              amount: {
                value: total.toFixed(2),
                currency_code: currency
              }
            }]
          });
        },
        onApprove: function(data, actions) {
          return actions.order.capture().then(function(details) {
            alert('Payment successful! Thank you, ' + details.payer.name.given_name);
          });
        },
        onError: function(err) {
          console.error(err);
          alert('Payment failed. Try again.');
        }
      }).render('#paypal-button-container');
    }
  }

  currencySelect.addEventListener('change', () => {
    loadPayPalScript(currencySelect.value);
  });

  // Initial load
  loadPayPalScript(currencySelect.value);
</script>

</body>
</html>
